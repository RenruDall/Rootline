<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rootline</title>
<!-- Rootline — part of Rootline Inventory (MIT). Filled in by the Rootline app (live view and saved reports). -->
<style>
:root {
  --bg:#f5f6f8; --panel:#ffffff; --ink:#1b1f24; --mute:#5d6772; --line:#dde2e8; --chip:#eef2f7; --acc:#0a66c2;
  --c-tenant:#4b3fb5; --c-mg:#7a4fd0; --c-sub:#0a66c2; --c-rg:#3d8bd9; --c-subnet:#8fb3d9;
  --c-compute:#e07a1f; --c-network:#1f9d74; --c-data:#c2410c; --c-other:#7b8794; --c-edge:#9aa6b2; --c-hl:#e11d48;
  --c-user:#0f766e; --c-group:#9333ea; --c-sp:#b45309; --c-role:#be123c; --c-priv:#dc2626; --c-pkg:#0e7490;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#101317; --panel:#181d23; --ink:#e7eaee; --mute:#97a1ac; --line:#2a313a; --chip:#1f2731; --acc:#5aa2f0;
    --c-tenant:#9d93f0; --c-mg:#b18cf0; --c-sub:#5aa2f0; --c-rg:#7ab6f2; --c-subnet:#4e6f93;
    --c-compute:#f5a25a; --c-network:#4cc9a0; --c-data:#f07b4f; --c-other:#8c97a3; --c-edge:#5b6672; --c-hl:#fb7185;
    --c-user:#2dd4bf; --c-group:#c084fc; --c-sp:#fbbf24; --c-role:#fb7185; --c-priv:#f87171; --c-pkg:#22d3ee;
  }
}
:root[data-theme="dark"] {
  --bg:#101317; --panel:#181d23; --ink:#e7eaee; --mute:#97a1ac; --line:#2a313a; --chip:#1f2731; --acc:#5aa2f0;
  --c-tenant:#9d93f0; --c-mg:#b18cf0; --c-sub:#5aa2f0; --c-rg:#7ab6f2; --c-subnet:#4e6f93;
  --c-compute:#f5a25a; --c-network:#4cc9a0; --c-data:#f07b4f; --c-other:#8c97a3; --c-edge:#5b6672; --c-hl:#fb7185;
  --c-user:#2dd4bf; --c-group:#c084fc; --c-sp:#fbbf24; --c-role:#fb7185; --c-priv:#f87171; --c-pkg:#22d3ee;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; display:flex; flex-direction:column; }
header { padding:10px 16px 8px; border-bottom:1px solid var(--line); background:var(--panel); display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; }
header .t { flex:1 1 260px; min-width:0; }
header h1 { margin:0; font-size:18px; }
.meta { color:var(--mute); font-size:12px; margin-top:2px; }
.appbar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.appbar .who { color:var(--mute); font-size:12px; margin-right:4px; }
.appbar select { padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); font:inherit; font-size:13px; max-width:220px; }
.bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
.seg button { border:0; background:none; color:var(--mute); padding:6px 12px; font:inherit; cursor:pointer; }
.seg button.on { background:var(--acc); color:#fff; }
.bar input[type=search] { flex:1 1 180px; min-width:140px; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); font:inherit; }
.btn { border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; }
.btn:hover { border-color:var(--acc); }
.btn.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
.filters { display:flex; flex-wrap:wrap; gap:6px; }
.filters label { display:inline-flex; align-items:center; gap:5px; font-size:12px; background:var(--chip); border-radius:999px; padding:3px 10px; cursor:pointer; user-select:none; }
.dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
main { flex:1; display:flex; min-height:0; }
#cy { flex:1; min-width:0; min-height:360px; }
aside { width:340px; border-left:1px solid var(--line); background:var(--panel); overflow:auto; padding:14px 16px; }
aside h2 { font-size:15px; margin:0 0 2px; word-break:break-word; }
aside .type { color:var(--mute); font-size:12px; word-break:break-all; }
aside dl { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; margin:10px 0; font-size:13px; }
aside dt { color:var(--mute); }
aside dd { margin:0; word-break:break-word; }
aside h3 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); margin:16px 0 6px; }
aside ul { list-style:none; padding:0; margin:0; }
aside li { padding:5px 0; border-bottom:1px solid var(--line); font-size:13px; }
aside a { color:var(--acc); cursor:pointer; text-decoration:none; }
.hint { color:var(--mute); font-size:13px; }
.rel { color:var(--mute); font-size:11px; display:block; }
.tag { display:inline-block; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; border-radius:4px; padding:0 5px; margin-left:4px; vertical-align:1px; background:var(--chip); color:var(--mute); }
.tag.priv { background:var(--c-priv); color:#fff; }
.path { font-size:12px; color:var(--mute); }
.chips { display:flex; flex-wrap:wrap; gap:4px; margin:8px 0; }
.chips button { border:1px solid var(--line); background:var(--bg); color:var(--mute); border-radius:999px; padding:2px 10px; font:inherit; font-size:12px; cursor:pointer; }
.chips button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:8px 0; }
.stats div { background:var(--chip); border-radius:6px; padding:6px 8px; font-size:11px; color:var(--mute); }
.stats b { display:block; font-size:17px; color:var(--ink); }
.warn { background:var(--chip); border-left:3px solid var(--c-compute); padding:6px 10px; font-size:12px; margin:0 16px; }
#overlay { position:fixed; inset:0; background:color-mix(in srgb, var(--bg) 85%, transparent); display:none; align-items:center; justify-content:center; z-index:10; padding:16px; }
#overlay .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:22px 24px; max-width:460px; width:100%; }
#overlay h2 { margin:0 0 8px; font-size:18px; }
.form label { display:block; font-size:13px; margin:10px 0 0; }
.form input { display:block; width:100%; margin-top:4px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); font:inherit; }
.form input:focus { outline:2px solid var(--acc); outline-offset:0; }
.form details { margin-top:12px; font-size:13px; } .form summary { cursor:pointer; color:var(--acc); }
.err { background:color-mix(in srgb, var(--c-priv) 14%, transparent); border-left:3px solid var(--c-priv); padding:6px 10px; font-size:13px; }
.warn-inline { background:var(--chip); border-left:3px solid var(--c-compute); padding:6px 10px; font-size:13px; }
[data-ext] { color:var(--acc); cursor:pointer; text-decoration:underline; }
.flash { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:6px; font-size:13px; z-index:20; }
.spin { width:22px; height:22px; border:3px solid var(--line); border-top-color:var(--acc); border-radius:50%; animation:sp 1s linear infinite; display:inline-block; vertical-align:middle; margin-right:8px; }
@keyframes sp { to { transform:rotate(360deg); } }
#report { flex:1; overflow:auto; padding:16px; min-width:0; }
#report .wrap { max-width:1100px; margin:0 auto; }
#report h2 { font-size:18px; margin:0 0 4px; }
#report h3 { font-size:13px; margin:18px 0 4px; }
#report a, .finding a { color:var(--acc); cursor:pointer; text-decoration:none; }
.sev { display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; border-radius:4px; padding:1px 6px; }
.sev.high { background:var(--c-priv); color:#fff; } .sev.medium { background:var(--c-compute); color:#fff; }
.sev.low { background:var(--c-sub); color:#fff; } .sev.info { background:var(--chip); color:var(--mute); }
.summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:8px; margin:12px 0; }
.summary div { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:12px; color:var(--mute); }
.summary b { display:block; font-size:20px; color:var(--ink); }
.toolbar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:8px 0; }
.toolbar .chips { margin:0; }
.toolbar select { padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); font:inherit; }
.finding { background:var(--panel); border:1px solid var(--line); border-radius:8px; margin:8px 0; }
.finding > summary { padding:10px 14px; cursor:pointer; list-style:none; display:flex; gap:8px; align-items:baseline; }
.finding > summary::-webkit-details-marker { display:none; }
.finding > summary .n { margin-left:auto; color:var(--mute); font-size:12px; white-space:nowrap; }
.finding .body { padding:0 14px 12px; font-size:13px; }
.finding .body p { margin:6px 0; }
.finding ul, .changes ul { list-style:none; padding:0; margin:8px 0 0; columns:2 320px; column-gap:24px; }
.finding li, .changes li { padding:3px 0; break-inside:avoid; font-size:13px; }
.check { list-style:none; padding:0; margin:6px 0 0; columns:2 280px; }
.check li { padding:2px 0; font-size:13px; }
.yes { color:var(--c-network); font-weight:700; } .no { color:var(--c-priv); font-weight:700; }
.chain { display:block; font-size:11px; color:var(--mute); }
.chain b { color:var(--ink); font-weight:600; }
.blast { background:color-mix(in srgb, var(--c-priv) 10%, transparent); border-left:3px solid var(--c-priv); padding:6px 10px; font-size:13px; margin:10px 0; }
.blast.calm { background:var(--chip); border-left-color:var(--c-network); }
.plus { color:var(--c-network); font-weight:700; } .minus { color:var(--c-priv); font-weight:700; }
@media (max-width:760px) {
  main { flex-direction:column; }
  aside { width:auto; border-left:0; border-top:1px solid var(--line); max-height:42vh; }
  #cy { min-height:52vh; }
}
</style>
</head>
<body>
<header>
  <div class="t"><h1 id="title">Rootline</h1><div class="meta" id="meta"></div></div>
  <div class="appbar" id="appbar" hidden>
    <span class="who" id="who"></span>
    <select id="snap" title="Saved scans"></select>
    <button class="btn primary" id="scan">Scan now</button>
    <button class="btn" id="download" title="Save an offline copy of this scan">Save report</button>
    <button class="btn" id="signout">Sign out</button>
  </div>
</header>
<div class="bar">
  <div class="seg">
    <button id="v-mind" class="on">Mind map</button>
    <button id="v-topo">Topology</button>
    <button id="v-access">Access</button>
    <button id="v-find">Findings</button>
    <button id="v-changes">Changes</button>
  </div>
  <div class="seg" id="shape-seg">
    <button id="s-radial" class="on">Radial</button>
    <button id="s-tree">Tree</button>
  </div>
  <input type="search" id="q" placeholder="Search name, type, IP prefix…">
  <button class="btn" id="expand">Expand all</button>
  <button class="btn" id="fit">Fit</button>
  <button class="btn" id="png">Export PNG</button>
</div>
<div class="bar filters" id="filters"></div>
<div id="warn"></div>
<main>
  <div id="cy"></div>
  <aside id="panel"></aside>
  <section id="report" hidden></section>
</main>
<div id="overlay"><div class="card" id="ocard"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script>
"use strict";
const APP = /*__APP__*/null;
const DATA = /*__DATA__*/null || demoData();
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ======================================================= model: resources
const byId = new Map(DATA.nodes.map(n => [n.id, n]));
const kids = new Map();
for (const n of DATA.nodes) {
  if (!n.parent) continue;
  if (!kids.has(n.parent)) kids.set(n.parent, []);
  kids.get(n.parent).push(n.id);
}
const relEdges = DATA.edges.filter(e => byId.has(e.s) && byId.has(e.t) && e.s !== e.t);
const HIER = new Set(["tenant", "mg", "sub", "rg"]);
const CATS = [["compute", "Compute"], ["network", "Network"], ["data", "Data & storage"], ["other", "Other"]];
const isResource = n => !HIER.has(n.cat) && n.cat !== "subnet" && !n.external;
const resCount = DATA.nodes.filter(isResource).length;
const tenantName = DATA.meta.tenantName || (byId.get("tenant") || {}).name || "Tenant";

function ancestors(id) {                    // id, parent, grandparent … up to the tenant root
  const out = []; let n = byId.get(id), guard = 0;
  if (!n && id === "tenant") return ["tenant"];
  while (n && guard++ < 50) { out.push(n.id); n = n.parent ? byId.get(n.parent) : null; }
  if (out.length && out[out.length - 1] !== "tenant" && byId.has("tenant")) out.push("tenant");
  return out;
}
const reach = new Map();                     // scope id -> resources underneath
for (const n of DATA.nodes) if (isResource(n)) for (const a of ancestors(n.id).slice(1)) reach.set(a, (reach.get(a) || 0) + 1);
const scopeName = id => id === "tenant" ? tenantName : (byId.get(id) || {}).name || id.split("/").pop().replace(/^mg:/, "");
const scopeKind = id => id === "tenant" ? "tenant root" : id.startsWith("mg:") ? "management group" :
  /^\/subscriptions\/[^/]+$/.test(id) ? "subscription" : /\/resourcegroups\/[^/]+$/.test(id) ? "resource group" : "resource";

// ======================================================= model: access
const ACC = DATA.access || { principals: [], azure: [], entra: [], members: {}, policies: [], ca: [] };
const pById = new Map(ACC.principals.map(p => [p.id, p]));
const memberOf = new Map();                  // principal -> groups it is (transitively) in
for (const [g, ms] of Object.entries(ACC.members || {})) for (const m of ms || []) {
  if (!memberOf.has(m)) memberOf.set(m, []); memberOf.get(m).push(g);
}
const group = (arr, key) => { const m = new Map(); for (const x of arr) { if (!m.has(x[key])) m.set(x[key], []); m.get(x[key]).push(x); } return m; };
const azBy = group(ACC.azure, "p"), enBy = group(ACC.entra, "p");
const PKG = new Map((ACC.packages || []).map(k => [k.id, k]));
const pkgOfGroup = new Map();                // group -> access packages that grant membership
for (const k of ACC.packages || []) for (const g of k.groups || []) { if (!pkgOfGroup.has(g)) pkgOfGroup.set(g, []); pkgOfGroup.get(g).push(k.id); }
const pkgAssignBy = group(ACC.packageAssignments || [], "p"), requestsBy = group(ACC.packageRequests || [], "p");
const gEligBy = group(ACC.groupEligible || [], "p"), gEligOf = group(ACC.groupEligible || [], "g");   // PIM for Groups
function effective(pid) {                    // every role: direct, through group membership, or as PIM-eligible group member
  const mem = memberOf.get(pid) || [];
  const via = [[pid, null, null], ...mem.map(g => [g, g, null]),
    ...(gEligBy.get(pid) || []).filter(e => !mem.includes(e.g)).map(e => [e.g, e.g, e])];
  const az = [], en = [];
  for (const [h, v, pim] of via) {
    for (const a of azBy.get(h) || []) az.push(Object.assign({ via: v, pim }, a));
    for (const a of enBy.get(h) || []) en.push(Object.assign({ via: v, pim }, a));
  }
  return { az, en };
}
const privCache = new Map();
const isPriv = pid => {
  if (!privCache.has(pid)) { const e = effective(pid); privCache.set(pid, e.az.some(a => a.priv) || e.en.some(a => a.priv)); }
  return privCache.get(pid);
};
const jit = a => a.status === "eligible" || !!a.pim;           // needs a PIM activation first
const SCAN_TIME = new Date(DATA.meta.generated).getTime() || Date.now();
const fmtDate = s => s ? new Date(s).toLocaleDateString() : "";
const daysLeft = s => s ? Math.ceil((new Date(s).getTime() - SCAN_TIME) / 864e5) : Infinity;
const untilTxt = s => s ? ` until ${fmtDate(s)}` : "";
const MANAGE_ROLES = new Set(["Owner", "User Access Administrator", "Role Based Access Control Administrator"]);
const roleLevel = r => MANAGE_ROLES.has(r) ? 3 : /(Reader|Viewer)\b/.test(r) && !/Contributor|Administrator|Owner|Operator/.test(r) ? 1 : 2;
const LEVEL = { 3: "Full control incl. access", 2: "Can change", 1: "Read only" };
const KIND = { user: "User", group: "Group", sp: "App / service principal", other: "Identity" };
const pName = id => (pById.get(id) || { name: id }).name;
const subsUnder = new Map();                 // scope -> subscriptions at or below it
for (const n of DATA.nodes) if (n.cat === "sub") for (const a of ancestors(n.id)) { if (!subsUnder.has(a)) subsUnder.set(a, new Set()); subsUnder.get(a).add(n.id); }
const subOf = sc => { const m = /^\/subscriptions\/[^/]+/.exec(sc || ""); return m ? m[0] : null; };
function pkgsFor(pid, g) {                   // access packages of pid that grant group g
  return (pkgAssignBy.get(pid) || []).filter(x => (pkgOfGroup.get(g) || []).includes(x.pkg) && PKG.has(x.pkg)).map(x => ({ pkg: PKG.get(x.pkg), until: x.until }));
}
function chain(pid, a) {                     // how pid holds role a: access package → group → PIM → role
  const steps = [];
  if (a.via) {
    for (const x of pkgsFor(pid, a.via)) steps.push(`access package <b>${esc(x.pkg.name)}</b>${esc(untilTxt(x.until))}`);
    steps.push(a.pim ? `eligible member of <b>${esc(pName(a.via))}</b> (PIM for Groups${esc(untilTxt(a.pim.until))})` : `member of <b>${esc(pName(a.via))}</b>`);
  }
  steps.push(`<b>${esc(a.role)}</b>${a.status === "eligible" ? ` eligible (PIM${esc(untilTxt(a.until))})` : esc(untilTxt(a.until))}`);
  return steps.join(" → ");
}
function peopleAt(id) {                      // everyone with an Azure role at or above a scope, groups expanded to people
  const set = new Set(ancestors(id)), people = new Map();
  const rows = ACC.azure.filter(a => set.has(a.scope));
  const put = (pid, a, via, pim) => {
    const e = Object.assign({ via, pim }, a), l = roleLevel(a.role);
    let x = people.get(pid);
    if (!x) people.set(pid, x = { pid, paths: [], level: 0, now: 0 });
    x.paths.push(e); x.level = Math.max(x.level, l); if (!jit(e)) x.now = Math.max(x.now, l);
  };
  for (const a of rows) {
    const p = pById.get(a.p), ms = ACC.members[a.p] || [], el = gEligOf.get(a.p) || [];
    if (p && p.kind === "group" && (ms.length || el.length)) { for (const m of ms) put(m, a, a.p, null); for (const e of el) put(e.p, a, a.p, e); }
    else put(a.p, a, null, null);
  }
  return { rows, people: [...people.values()] };
}
function blast(pid) {                        // what this identity could change if misused: now, and after PIM activation
  const e = effective(pid);
  const calc = list => {
    const sc = [...new Set(list.filter(a => roleLevel(a.role) >= 2).map(a => a.scope))], set = new Set(sc);
    const top = sc.filter(s => !ancestors(s).slice(1).some(x => set.has(x)));
    let res = 0; const subs = new Set();
    for (const s of top) {
      res += reach.get(s) || (byId.has(s) && isResource(byId.get(s)) ? 1 : 0);
      for (const x of subsUnder.get(s) || []) subs.add(x);
      if (subOf(s)) subs.add(subOf(s));
    }
    return { res, subs: subs.size, manage: new Set(list.filter(a => roleLevel(a.role) === 3).map(a => a.scope)).size };
  };
  return { now: calc(e.az.filter(a => !jit(a))), all: calc(e.az), en: e.en };
}

// ======================================================= state
let view = "mind", shape = "radial", selectedP = null, accessFilter = "priv";
const hiddenCats = new Set(), expanded = new Set(), openSubnets = new Set();
const AUTO_EXPAND = resCount <= 400;

// ======================================================= header
$("title").textContent = DATA.meta.empty ? "Rootline" : `Rootline — ${tenantName}`;
$("meta").textContent = DATA.meta.empty ? "" :
  `${DATA.meta.demo ? "Demo data · " : ""}Scanned ${new Date(DATA.meta.generated).toLocaleString()} · ${DATA.meta.scope} · ` +
  `${resCount} resources · ${relEdges.length} connections · ${ACC.principals.length} identities`;
function updateWarn() {
  let msg = "";
  if (view === "mind" && !AUTO_EXPAND) msg = `${resCount} resources: resource groups start collapsed. Click one to open it, or use Expand all.`;
  if (view === "topo" && topoCompact) msg = `Large estate: the topology starts with the network backbone. Click a subnet to show what's connected to it.`;
  if (view === "access" && DATA.meta.entra === false) msg = `Entra wasn't read for this scan: identities show as object IDs, group members and directory roles are missing.`;
  $("warn").innerHTML = msg ? `<p class="warn">${esc(msg)}</p>` : "";
}

// ======================================================= filters
for (const [k, label] of CATS) {
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" checked data-cat="${k}"><span class="dot" style="background:var(--c-${k})"></span>${label}`;
  $("filters").appendChild(l);
}
$("filters").addEventListener("change", e => {
  const c = e.target.dataset.cat;
  e.target.checked ? hiddenCats.delete(c) : hiddenCats.add(c);
  applyFilters();
});
function applyFilters() {
  if (view === "access") return;
  cy.nodes().forEach(n => n.style("display", hiddenCats.has(n.data("cat")) ? "none" : "element"));
}

// ======================================================= style
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function buildStyle() {

  const on = a => `${a.role} on ${scopeName(a.scope)}`;
  const subsN = DATA.nodes.filter(n => n.cat === "sub");

  // ---------- identity

      "Keep two cloud-only emergency (break-glass) accounts as permanent Global Administrators. Make everyone else eligible in PIM, with MFA and approval on activation, or move them to a less privileged role.",
      gaNow.map(p => pItem(p)));

      "Microsoft recommends fewer than five Global Administrators, active or eligible.",
      "Review who really needs it; most tasks work with a narrower role such as User, Exchange or Security Administrator.",
      gaAll.map(p => pItem(p)));
    const standing = ACC.entra.filter(a => a.priv && !jit(a) && a.role !== "Global Administrator" && (pById.get(a.p) || {}).kind !== "sp");
    add("medium", "Identity", "Privileged directory roles held permanently",
      "Privileged roles that are always on widen the window for misuse. PIM turns them into just-in-time access with MFA, justification and an audit trail.",
      "Convert these assignments to eligible in Privileged Identity Management (Entra ID P2 or Governance).",
      standing.map(a => pItem(a.p, a.role)));
    const gPriv = [], gRead = [];

function accessRegister() {                  // one row per identity × role × scope; groups expanded to their members

    const p = pById.get(pid) || { name: pid, kind: "other" }, pk = a.via ? pkgsFor(pid, a.via) : [];
    rows.push({ id: pid, name: p.name, upn: p.upn || "", kind: KIND[p.kind] || "Identity", guest: p.guest ? "Yes" : "", plane, role: a.role,
      level: plane === "Azure" ? LEVEL[roleLevel(a.role)] : a.priv ? "Privileged" : "Standard", priv: !!a.priv || (plane === "Azure" && roleLevel(a.role) >= 2),
      scope: plane === "Azure" ? scopeName(a.scope) : a.scope && a.scope !== "/" ? a.scope : "Directory",
      scopeType: plane === "Azure" ? scopeKind(a.scope) : "Entra directory",
      path: plane === "Azure" ? ancestors(a.scope).reverse().map(scopeName).join(" / ") : "",

      group: a.via ? pName(a.via) : "", pimGroup: a.pim ? "Yes" : "", pkg: pk.map(x => x.pkg.name).join("; ") });
